name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(jq -r '.version' module.json)
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version $TAG_VERSION) does not match module.json's version ($MODULE_VERSION) — bump module.json before tagging."
            exit 1
          fi

      - name: Build the module zip
        run: |
          zip -r sablewood-messengers.zip . \
            -x '.git/*' '.github/*' '.gitignore' 'sablewood-messengers.zip'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            module.json sablewood-messengers.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
